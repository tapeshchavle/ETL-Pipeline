spring.application.name=Foodingo

# MongoDB - MUST be set via environment variable
spring.data.mongodb.uri=${MONGODB_URI}

# Server port - Azure expects 8080
server.port=8080

# JWT Secret - MUST be set via environment variable
jwt.secret=${JWT_SECRET}

# Razorpay - MUST be set via environment variable
razorpay.key=${RAZORPAY_KEY}
razorpay.secret=${RAZORPAY_SECRET}

# AWS S3 Configuration - MUST be set via environment variable
aws.access.key=${AWS_ACCESS_KEY}
aws.secret.key=${AWS_SECRET_KEY}
aws.s3.bucket=${AWS_S3_BUCKET}
aws.region=${AWS_REGION:ap-south-1}

# ── Data Engineering Pipeline ─────────────────────────────────────────────────
# Kafka Producer (Spring Boot connects to Kafka external listener on port 9094)
# Default points to local Docker pipeline. No-op if Kafka is not running.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# ML Recommendation Service (Python FastAPI)
ml.service.url=${ML_SERVICE_URL:http://localhost:5001}

# Data Lake S3 Bucket (separate from food images bucket tapesh-myfood-images — us-east-1)
aws.s3.datalake.bucket=${AWS_DATALAKE_BUCKET:foodingo-data-lake}
aws.s3.datalake.region=${AWS_DATALAKE_REGION:us-east-1}

# Serialize Instant as ISO-8601 string not epoch for cleaner API responses
spring.jackson.serialization.write-dates-as-timestamps=false
spring.config.import=optional:file:.env[.properties]
